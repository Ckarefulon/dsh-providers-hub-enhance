name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查（补丁器与新模块）
        shell: bash
        run: node scripts/ci-syntax-check.mjs

      - name: 补丁描述自检（schema 与资产齐全）
        shell: bash
        run: node scripts/ci-verify-patch-data.mjs

      - name: 单元测试
        run: npm test
